[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[package]
name = "herdr-terminal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.95"
description = "The terminal client for Herdr Core"
readme = "README.md"
autobins = false
default-run = "ht"

[[bin]]
name = "ht"
path = "src/main.rs"

[lints]
workspace = true

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

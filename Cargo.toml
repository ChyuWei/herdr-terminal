[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[package]
name = "herdr-terminal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.95"
description = "The terminal client for Herdr Core"
readme = "README.md"
autobins = false
default-run = "ht"

[lib]
name = "herdr_terminal"
path = "src/lib.rs"

[[bin]]
name = "ht"
path = "src/main.rs"

# A deterministic stand-in for `hc connect` used by the probe's error-path and
# fast-exit tests. It runs its own tests when started without arguments, and
# speaks the framed protocol when the probe spawns it as `--version`/`connect`.
[[test]]
name = "fake_core"
path = "tests/fake_core.rs"
harness = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
